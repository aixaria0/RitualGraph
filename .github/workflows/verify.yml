name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Validate reference model
        run: ritualgraph validate models/molecular_pipeline.json
      - name: Run tests
        run: pytest
      - name: Prove unsafe scenario fails
        run: |
          set +e
          ritualgraph run models/molecular_pipeline.json -t T-POISON
          code=$?
          test "$code" -eq 3
      - name: Prove defended scenario passes
        run: ritualgraph run models/molecular_pipeline.json -t T-POISON -c C-PROVENANCE
